# Server Port
server.port=8080

# MySQL Database Configuration
# Update username and password as per your local MySQL installation
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Pooja@2003}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Settings (Base64-like secret, at least 32 characters for HS256)
app.jwt.secret=MySuperSimpleBankingSecretKeyForJwtTokenGeneration2026
app.jwt.expiration-ms=86400000

# Swagger UI Path
springdoc.swagger-ui.path=/swagger-ui.html
